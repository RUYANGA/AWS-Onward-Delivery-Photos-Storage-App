# Runs on every merge (push) to main: build -> scan -> push :<git-sha> -> upload the deploy
# bundle -> push :latest. The checks already ran on the pull request (ci.yml), so they are not
# repeated here. The :latest push starts the CodePipeline blue/green release
# (infra repo: templates/pipeline.yaml). AWS access is through GitHub OIDC: no stored keys.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:        # re-run by hand (also uploads the first deploy bundle)

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'onward-dev/delivery-photos-app' }}
  TASK_FAMILY: ${{ vars.TASK_FAMILY || 'onward-dev-delivery-photos' }}
  CONTAINER_NAME: app
  DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}          # empty -> onward-dev-deploy-bundles-<account>-<region>
  IMAGE_TAG: ${{ github.sha }}

jobs:
  release:
    name: Build and release
    # Skipped until the infra bootstrap has created the role (AWS_ROLE_ARN = output AppCiRoleArn).
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        # One manifest per release (no attestation manifests), so ECR's "keep 10" counts releases.
        run: docker build --pull --provenance=false --build-arg APP_VERSION="$IMAGE_TAG" -t app:candidate .

      - name: Scan image for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0, pinned by SHA
        with:
          image-ref: app:candidate
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Get short-lived AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push git-SHA tag
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
        run: |
          docker tag app:candidate "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:$IMAGE_TAG"

      - name: Upload deployment bundle (taskdef + appspec)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          DEPLOY_BUCKET="${DEPLOY_BUCKET:-onward-dev-deploy-bundles-${REGISTRY%%.*}-${AWS_REGION}}"
          set +e
          ./scripts/build-deploy-bundle.sh build; rc=$?
          set -e
          if [ $rc -eq 0 ]; then
            # The label names this release in the pipeline's run history and Rollback dialog.
            label="$(./scripts/release-label.sh "$IMAGE_TAG")"
            aws s3 cp build/deploy-bundle.zip "s3://$DEPLOY_BUCKET/deploy/deploy-bundle.zip" \
              --metadata "codepipeline-artifact-revision-summary=$label"
            echo "Pipeline label: $label"
          elif [ $rc -ne 3 ]; then
            exit $rc
          fi

      - name: Move "latest" to this build (starts the release)
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
        run: |
          docker tag app:candidate "$IMAGE:latest"
          docker push "$IMAGE:latest"
          echo "### Released ${IMAGE_TAG::7}" >> "$GITHUB_STEP_SUMMARY"
          echo "CodePipeline onward-dev-photos-release will now run a blue/green deployment." >> "$GITHUB_STEP_SUMMARY"
